<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-left">
    <h1>
      <a href="home.html" class="logo">Student Restaurants</a>
    </h1>
    <nav class="nav-links">
      <a href="home.html">Restaurants</a>
      <a href="favorites.html">Favorites</a>
      <a href="map.html">Map</a>
    </nav>
  </div>

  <div class="user-menu">
    <button class="user-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </button>
    <div class="dropdown">
      <p class="username">Not logged in</p>
      <a href="auth.html">Login / Sign up</a>
    </div>
  </div>
</header>

<main>
  <h2>My Profile</h2>

  <div class="profile-page">

    <div class="profile-card">
      <div class="profile-pic-wrapper">
        <img id="profilePicImg" class="profile-pic" src="" alt="Profile picture">
        <label class="profile-pic-label" for="profilePicInput">Change photo</label>
        <input type="file" id="profilePicInput" accept="image/*" hidden>
      </div>
      <p class="profile-username" id="profileUsername"></p>
      <p class="profile-email" id="profileEmail"></p>
    </div>

    <div class="profile-forms">

      <section class="profile-section">
        <h3>Update Info</h3>
        <div class="profile-field">
          <label for="newUsername">Username</label>
          <input type="text" id="newUsername" placeholder="New username">
        </div>
        <div class="profile-field">
          <label for="newEmail">Email</label>
          <input type="email" id="newEmail" placeholder="New email">
        </div>
        <p class="profile-msg" id="infoMsg"></p>
        <button class="profile-btn" id="saveInfoBtn">Save Changes</button>
      </section>

      <section class="profile-section">
        <h3>Change Password</h3>
        <div class="profile-field">
          <label for="currentPassword">Current password</label>
          <input type="password" id="currentPassword" placeholder="Current password">
        </div>
        <div class="profile-field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="New password (min 6 chars)">
        </div>
        <div class="profile-field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm new password">
        </div>
        <p class="profile-msg" id="pwMsg"></p>
        <button class="profile-btn" id="savePasswordBtn">Change Password</button>
      </section>

    </div>
  </div>
</main>

<footer>
  <p>Student Restaurants 2026</p>
</footer>

<script src="js/header.js"></script>
<script src="js/profile.js"></script>

</body>
</html>

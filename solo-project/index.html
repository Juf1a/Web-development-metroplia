<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Opiskelijaravintolat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Student restaurants</h1>

  <div class="user-menu">
    <button class="user-btn">👤</button>

    <div class="dropdown">
      <p class="username">Not logged in</p>
      <a href="#">⭐ Favorites</a>
      <a href="auth.html">Edit profile</a>
      <a href="#">Logout</a>
    </div>
  </div>
</header>

<main>

    <div class="auth-link">
        <a href="auth.html">Login / Sign up</a>
    </div>

  <!-- FILTERS -->
  <section class="filters">
    <select id="cityFilter">
      <option>All cities</option>
    </select>

    <select id="providerFilter">
      <option>All providers</option>
    </select>
  </section>

  <!-- RESTAURANTS -->
  <h2>Restaurants</h2>
  <section class="restaurant-list" id="restaurantList"></section>


  <!-- MENU -->
  <section class="menu">
    <h2 id="restaurantName">Select a restaurant</h2>
    <div id="menuContent"></div>
  </section>

  <!-- MAP -->
  <section class="map-section">
    <h2>Map</h2>
    <div id="map"></div>
  </section>

</main>

<footer>
  <p>Restaurant menu app</p>
</footer>

<script src="js/main.js"></script>

</body>
</html>

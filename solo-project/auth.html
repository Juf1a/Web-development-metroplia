<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-left">
    <h1>
      <a href="home.html" class="logo">Student Restaurants</a>
    </h1>
    <nav class="nav-links">
      <a href="home.html">Restaurants</a>
      <a href="favorites.html">Favorites</a>
      <a href="map.html">Map</a>
    </nav>
  </div>
</header>

<main class="auth-page">

  <h1 id="authTitle">Login</h1>

  <div class="auth-box">

    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email" style="display: none;">
    <input type="password" id="password" placeholder="Password">

    <button id="authButton" onclick="login()">Login</button>

    <p id="switchText">Don't have an account?<a href="#" onclick="showRegister()">Register</a></p>

  </div>

  <a href="home.html" class="back-btn">← Back</a>

</main>

<script src="js/auth.js"></script>

</body>
</html>

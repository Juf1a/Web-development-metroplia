<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-left">
    <h1>
      <a href="home.html" class="logo">Student Restaurants</a>
    </h1>
    <nav class="nav-links">
      <a href="home.html">Restaurants</a>
      <a href="favorites.html" class="nav-active">Favorites</a>
      <a href="map.html">Map</a>
    </nav>
  </div>

  <div class="user-menu">
    <button class="user-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </button>
    <div class="dropdown">
      <p class="username">Not logged in</p>
      <a href="auth.html">Login / Sign up</a>
    </div>
  </div>
</header>

<main>
  <h2>Your Favorites</h2>
  <section class="restaurant-list" id="favoritesList">
    <p class="empty-msg">No favorites yet. Browse restaurants and click the star to add one.</p>
  </section>
</main>

<footer>
  <p>Student Restaurants 2026</p>
</footer>

<script src="js/header.js"></script>
<script src="js/favorites.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Restaurants</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-left">
    <h1>
      <a href="home.html" class="logo">Student Restaurants</a>
    </h1>
    <nav class="nav-links">
      <a href="home.html" class="nav-active">Restaurants</a>
      <a href="favorites.html">Favorites</a>
      <a href="map.html">Map</a>
    </nav>
  </div>

  <div class="user-menu">
    <button class="user-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </button>
    <div class="dropdown">
      <p class="username">Not logged in</p>
      <a href="auth.html">Login / Sign up</a>
    </div>
  </div>
</header>

<main>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search restaurants...">
    <select id="cityFilter">
      <option value="">All cities</option>
    </select>
    <select id="providerFilter">
      <option value="">All providers</option>
    </select>
  </div>

  <h2>Restaurants</h2>
  <section class="restaurant-list" id="restaurantList"></section>
</main>

<footer>
  <p>Student Restaurants 2026</p>
</footer>

<script src="js/header.js"></script>
<script src="js/main.js"></script>

</body>
</html>
